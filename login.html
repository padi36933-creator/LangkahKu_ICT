<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Login - LangkahKu ICT</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: grid; place-items: center; height: 100vh; background: var(--page); }
    .auth-box { background: var(--surface); padding: 40px; border-radius: 19px; box-shadow: var(--shadow); width: 100%; max-width: 400px; }
    .auth-box h1 { font-size: 24px; margin-bottom: 5px; text-align: center; }
    .auth-box p.sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px;}
    .field-group { margin-bottom: 15px; }
    .auth-actions { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>
  <div class="auth-box">
    <h1>LangkahKu ICT</h1>
    <p class="sub">Belajar komputer dasar</p>
    <form id="authForm">
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="auth-actions">
        <button type="submit" id="btnLogin" class="primary-button">Masuk</button>
        <button type="button" id="btnRegister" class="secondary-button">Daftar sebagai Siswa</button>
      </div>
      <p style="font-size: 11px; color: var(--muted); text-align: center; margin-top: 15px;">
        Pendaftaran guru ditetapkan oleh administrator. Daftarkan akun lalu minta admin mengubah role menjadi guru.
      </p>
      <p id="authMsg" style="color: #a44848; font-size: 13px; margin-top: 10px; text-align: center; font-weight: bold;"></p>
    </form>
  </div>
  <script src="assets/db.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('btnLogin').addEventListener('click', (e) => {
        e.preventDefault();
        window.auth.login(document.getElementById('email').value, document.getElementById('password').value);
    });
    document.getElementById('btnRegister').addEventListener('click', (e) => {
        e.preventDefault();
        window.auth.register(document.getElementById('email').value, document.getElementById('password').value);
    });
  </script>
</body>
</html>
